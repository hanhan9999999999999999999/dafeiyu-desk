<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
<title>大肥鱼 · 相处档案</title>
<style>
  :root {
    --bg: #141620;
    --panel: rgba(255, 255, 255, .045);
    --line: rgba(255, 255, 255, .09);
    --text: #eef2ff;
    --muted: rgba(232, 239, 255, .58);
    --pink: #FF8FBB;
    --blue: #8FB8FF;
    --green: #6EE7A8;
    --orange: #FFC062;
    --purple: #B0A8FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: transparent;
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #card {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: var(--bg);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .06);
    /* 透明无边框窗口不叠 backdrop-filter / 位移，避免 Windows 上圆角外出现方角。 */
    opacity: 0;
    transition: opacity .18s ease;
  }
  #card.show { opacity: 1; }
  /* 顶部一条很淡的粉蓝光，和主窗/面板同一套语言 */
  #card::before {
    content: ""; position: absolute; inset: -40% 20% auto -20%; height: 180px;
    background: radial-gradient(closest-side, rgba(255, 143, 187, .22), transparent 72%),
                radial-gradient(closest-side at 70% 30%, rgba(143, 184, 255, .18), transparent 70%);
    pointer-events: none;
  }
  .head {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    flex: 0 0 46px;
    padding: 0 14px;
    -webkit-app-region: drag;
  }
  .head b { font-size: 13px; letter-spacing: .3px; }
  .head .days { font-size: 11px; color: var(--muted); }
  .head .sp { flex: 1; }
  .head .close {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px; border: 0; border-radius: 8px;
    background: transparent; color: var(--muted); cursor: pointer;
    display: grid; place-items: center;
  }
  .head .close:hover { background: rgba(255, 255, 255, .08); color: #fff; }

  .body { position: relative; z-index: 1; flex: 1; min-height: 0; overflow-y: auto; padding: 2px 16px 8px; }
  .body::-webkit-scrollbar { width: 6px; }
  .body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 4px; }
  .body::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .2); }

  .hero {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    padding: 14px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(255, 143, 187, .14), rgba(143, 184, 255, .10) 58%, rgba(255, 255, 255, .03));
    border: 1px solid rgba(255, 255, 255, .08);
    overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; right: -30px; top: -50px; width: 140px; height: 140px;
    border-radius: 50%; border: 1px solid rgba(255, 255, 255, .07);
  }
  .medal {
    flex: 0 0 66px; width: 66px; height: 66px; border-radius: 50%;
    display: grid; place-items: center; font-size: 30px;
    background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .28), rgba(255, 255, 255, .04) 44%, rgba(0, 0, 0, .18));
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 8px 24px rgba(255, 143, 187, .22), inset 0 0 22px rgba(255, 143, 187, .18);
  }
  .lvInfo { flex: 1; min-width: 0; }
  .lvTop { display: flex; align-items: baseline; gap: 8px; }
  .lvName { font-size: 24px; font-weight: 800; letter-spacing: .5px; }
  .lvFavor { font-size: 12px; color: var(--muted); }
  .lvDesc { margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .lvBarWrap { margin-top: 9px; height: 7px; border-radius: 5px; background: rgba(255, 255, 255, .10); overflow: hidden; }
  .lvBar { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue)); box-shadow: 0 0 12px rgba(255, 143, 187, .45); transition: width .5s cubic-bezier(.22, .61, .36, 1); }
  .lvNext { margin-top: 5px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .lvNext b { color: var(--blue); font-weight: 600; }

  .sec { display: flex; align-items: center; gap: 8px; margin: 15px 2px 8px; font-size: 12px; color: var(--muted); }
  .sec b { color: var(--text); font-size: 12.5px; font-weight: 700; letter-spacing: .2px; }
  .sec .sp { flex: 1; }
  .sec em { font-style: normal; color: var(--muted); font-size: 11px; }

  .today { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cell {
    padding: 10px 8px; border-radius: 11px; text-align: center;
    background: var(--panel); border: 1px solid var(--line);
  }
  .cell .e { font-size: 16px; line-height: 1; }
  .cell .v { margin-top: 6px; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cell .k { margin-top: 2px; font-size: 10.5px; color: var(--muted); }

  .chart {
    position: relative;
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    padding: 10px 8px 8px;
    border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  }
  .emptyNote {
    display: none; position: absolute; left: 0; right: 0; top: 30px;
    text-align: center; font-size: 10.5px; color: var(--muted);
    pointer-events: none; letter-spacing: .2px;
  }
  .chart.empty .emptyNote { display: block; }
  .chart.empty .barCol .num { opacity: .35; }
  .barCol { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
  .barCol .num { font-size: 9.5px; color: var(--muted); height: 12px; font-variant-numeric: tabular-nums; }
  .barCol .track { width: 100%; height: 58px; display: flex; align-items: flex-end; }
  .barCol .bar {
    width: 100%; min-height: 3px; border-radius: 4px;
    background: linear-gradient(180deg, rgba(143, 184, 255, .85), rgba(143, 184, 255, .35));
    transition: height .45s cubic-bezier(.22, .61, .36, 1);
  }
  .barCol.today .bar { background: linear-gradient(180deg, var(--pink), rgba(255, 143, 187, .40)); box-shadow: 0 0 10px rgba(255, 143, 187, .22); }
  .barCol .d { font-size: 10px; color: var(--muted); }
  .barCol.today .d { color: var(--pink); font-weight: 700; }

  .badges { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .badge {
    position: relative; padding: 8px 4px 7px; border-radius: 10px; text-align: center;
    background: var(--panel); border: 1px solid var(--line);
    transition: transform .15s ease, background .15s ease;
  }
  .badge .e { font-size: 19px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .3)); }
  .badge .n { margin-top: 4px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge.got { background: linear-gradient(160deg, rgba(255, 143, 187, .16), rgba(255, 255, 255, .03)); border-color: rgba(255, 143, 187, .28); }
  .badge.lock { opacity: .32; filter: grayscale(1); }
  .badge:hover { transform: translateY(-2px); }
  .badge .tip {
    position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%) translateY(3px);
    padding: 6px 8px; border-radius: 7px; font-size: 10.5px; line-height: 1.35; white-space: nowrap;
    background: rgba(10, 12, 20, .96); border: 1px solid var(--line); color: var(--text);
    opacity: 0; pointer-events: none; transition: opacity .12s ease, transform .12s ease; z-index: 5;
  }
  .badge:hover .tip { opacity: 1; transform: translateX(-50%); }

  .foot {
    flex: 0 0 auto; padding: 10px 16px 14px;
    border-top: 1px solid var(--line);
    background: rgba(10, 12, 20, .35);
  }
  .total { font-size: 10.5px; color: var(--muted); line-height: 1.6; margin-bottom: 9px; }
  .btns { display: flex; gap: 8px; }
  .btn {
    flex: 1; height: 34px; border-radius: 9px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, .055); color: var(--text);
    font-size: 12px; font-family: inherit; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, .10); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: linear-gradient(135deg, rgba(255, 143, 187, .9), rgba(176, 168, 255, .9)); border-color: transparent; color: #201826; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.06); }
  :focus-visible { outline: 2px solid rgba(143, 184, 255, .75); outline-offset: 2px; }
  button:focus:not(:focus-visible) { outline: none; }

  .toast {
    position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(8px);
    padding: 7px 13px; border-radius: 8px; font-size: 11.5px;
    background: rgba(12, 15, 24, .95); border: 1px solid var(--line); color: var(--text);
    opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; z-index: 9;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div id="card">
    <div class="head">
      <b>相处档案</b>
      <span class="days" id="days">第 1 天</span>
      <span class="sp"></span>
      <button class="close" id="close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg>
      </button>
    </div>

    <div class="body">
      <div class="hero">
        <div class="medal" id="medal">🐟</div>
        <div class="lvInfo">
          <div class="lvTop">
            <span class="lvName" id="lvName">初见</span>
            <span class="lvFavor" id="lvFavor">好感 0</span>
          </div>
          <div class="lvDesc" id="lvDesc">还在互相打量，说话都客气。</div>
          <div class="lvBarWrap"><div class="lvBar" id="lvBar"></div></div>
          <div class="lvNext"><span id="lvNextLeft">下一级</span><b id="lvNextNeed"></b></div>
        </div>
      </div>

      <div class="sec"><b>今天</b><span class="sp"></span><em id="todayDate"></em></div>
      <div class="today">
        <div class="cell"><div class="e">🐟</div><div class="v" id="tFed">0</div><div class="k">喂食</div></div>
        <div class="cell"><div class="e">🎾</div><div class="v" id="tPlay">0</div><div class="k">玩耍</div></div>
        <div class="cell"><div class="e">🫳</div><div class="v" id="tPet">0</div><div class="k">摸头</div></div>
        <div class="cell"><div class="e">⏳</div><div class="v" id="tMin">0</div><div class="k">一起（分钟）</div></div>
      </div>

      <div class="sec"><b>最近七天</b><span class="sp"></span><em>每天做过的事</em></div>
      <div class="chart" id="chart"></div>

      <div class="sec"><b>徽章</b><span class="sp"></span><em id="achCount">0 / 0</em></div>
      <div class="badges" id="badges"></div>
    </div>

    <div class="foot">
      <div class="total" id="total">第 1 天 · 还没有记录</div>
      <div class="btns">
        <button class="btn" id="copy" type="button">复制报告</button>
        <button class="btn primary" id="save" type="button">导出 .md</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <script src="pet.js"></script>
  <script src="profile-win.js"></script>
</body>
</html>
