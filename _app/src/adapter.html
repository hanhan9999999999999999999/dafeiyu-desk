<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob:; media-src 'self' blob: data: http://127.0.0.1:*; connect-src 'self' data: blob: http://127.0.0.1:* ws://127.0.0.1:*; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>大肥鱼 · 模型适配器</title>
<style>
  :root{
    --bg:#12141c; --panel:#191c28; --panel2:#1f2331; --line:#2a2f42;
    --text:#e8eaf2; --dim:#8b90a6; --dim2:#6d7288;
    --accent:#5b8cff; --accent2:#3d6fe0; --ok:#3ddc97; --warn:#ffb648; --bad:#ff6b6b;
    --r:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font:13px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    overflow:hidden; display:flex; flex-direction:column;
    user-select:none;
  }
  button{font:inherit; color:inherit; cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#2f3548; border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:#3d4560;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ── 顶栏 ───────────────────────────── */
  header{
    display:flex; align-items:center; gap:10px;
    padding:0 14px; height:46px; flex:0 0 auto;
    border-bottom:1px solid var(--line);
    -webkit-app-region:drag;
  }
  header .mark{
    width:20px;height:20px;border-radius:6px;
    background:linear-gradient(135deg,#5b8cff,#8f6bff);
    box-shadow:0 2px 8px rgba(91,140,255,.35);
  }
  header h1{font-size:13.5px; font-weight:600; letter-spacing:.2px;}
  header .sub{font-size:11.5px; color:var(--dim2); margin-left:2px;}
  header .spacer{flex:1;}
  header .win{
    -webkit-app-region:no-drag; width:30px;height:30px;border-radius:8px;
    background:transparent; border:none; color:var(--dim);
    display:flex;align-items:center;justify-content:center; font-size:15px;
  }
  header .win:hover{background:#232838; color:var(--text);}
  header .win.close:hover{background:#c0392b; color:#fff;}

  /* ── 三栏 ───────────────────────────── */
  .wrap{flex:1; display:flex; min-height:0;}

  /* 左：模型库 */
  .lib{
    width:236px; flex:0 0 auto; display:flex; flex-direction:column;
    background:var(--panel); border-right:1px solid var(--line); min-height:0;
  }
  .lib-h{
    padding:11px 12px 8px; font-size:11px; letter-spacing:.8px;
    text-transform:uppercase; color:var(--dim2);
    display:flex; align-items:center; gap:6px;
  }
  .lib-h .n{
    font-size:10.5px; padding:1px 6px; border-radius:6px;
    background:#252b3c; color:var(--dim); letter-spacing:0;
  }
  #packList{flex:1; overflow-y:auto; padding:0 8px 8px;}
  .pack{
    display:flex; gap:9px; align-items:center;
    padding:8px; border-radius:var(--r); margin-bottom:4px;
    border:1px solid transparent; cursor:pointer;
  }
  .pack:hover{background:#212636;}
  .pack.on{background:#232b42; border-color:#3a4a72;}
  .pack .thumb{
    width:40px;height:40px;border-radius:8px;flex:0 0 auto;
    background:#0f1119 center/cover no-repeat; border:1px solid #2a3044;
    display:flex;align-items:center;justify-content:center;
    font-size:16px; color:#3d4560;
  }
  .pack .meta{min-width:0; flex:1;}
  .pack .nm{
    font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:4px; min-width:0;
  }
  .pack .nm .txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pack .id{
    font-size:10.5px; color:var(--dim2); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; font-family:Consolas,monospace;
  }
  .pack .tag{
    flex:0 0 auto; font-size:10px; padding:1px 5px; border-radius:4px;
    background:#2b3247; color:#9aa3bd; margin-left:4px; white-space:nowrap;
  }
  .pack .tag.user{background:#2c3d2e; color:#8fd3a0;}
  .pack .tag.bad{background:#3a1f28; color:#ff8fa0;}
  /* 三个操作按钮改成浮层：常驻占 66px 会把「大肥鱼（副本）」这种名字挤成「大…」 */
  .pack{position:relative; display:grid; grid-template-columns:38px 1fr; grid-template-rows:auto auto; column-gap:8px; align-items:center;}
  .pack .thumb{grid-row:1 / span 2;}
  .pack .meta{grid-column:2; grid-row:1;}
  .pack .acts{grid-column:2; grid-row:2; justify-content:flex-end; margin:1px 0 0;
    display:flex; gap:4px; opacity:.55; transition:opacity .12s;}
  .pack:hover .acts,.pack.on .acts{opacity:1}
  .pack .act{width:auto; min-width:30px; height:18px; padding:0 5px; font-size:10px; line-height:1;
    border:0; border-radius:5px; background:rgba(255,255,255,.05); color:#8b94ad;
    cursor:pointer; font-family:inherit;}
.pack .act:disabled{opacity:.25; cursor:default}
.pack .tag.override{background:#3a3320; color:#dcc07a;}
  /* 拖拽导入：整窗高亮内描边，暗示「松手就导入」 */
  body.dropping::after{
    content:"松手导入模型包"; position:fixed; inset:8px; z-index:900;
    border:2px dashed var(--accent); border-radius:14px;
    background:rgba(91,140,255,.10); color:#cfe0ff;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; letter-spacing:.08em; pointer-events:none;
  }
  .lib-f{padding:8px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:32px; padding:0 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:12.5px;
    transition:background .14s, border-color .14s, opacity .14s;
  }
  .btn:hover{background:#272d3f; border-color:#39405a;}
  .btn:active{transform:translateY(.5px);}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn.primary{background:var(--accent); border-color:transparent; color:#fff; font-weight:600;}
  .btn.primary:hover{background:#6d9aff;}
  .btn.primary.dirty{box-shadow:0 0 0 2px rgba(91,140,255,.45);}
  /* 「恢复默认」是危险动作，长得要次要：不要和「保存」抢视线 */
  .btn.ghost{background:transparent; border-color:#2f3648; color:#8b94ab;}
  .btn.ghost:hover{background:#22283a; color:#d6dcec; border-color:#3d4761;}
  .btn.grow{flex:1;}
  .btn.sm{height:26px; padding:0 9px; font-size:11.5px; border-radius:7px;}

  /* 中：预览 */
  .stage{
    flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column;
    position:relative; background:
      radial-gradient(900px 520px at 50% 22%, #1b2233 0%, #12141c 62%);
  }
  #preview{flex:1; min-height:0; position:relative; overflow:hidden;}
  /* 一个模型都没有时的引导：这是安装后的第一屏，不能是空的 */
  .wel{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px; text-align:center; z-index:5;}
  .wel-ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:30px;
    background:radial-gradient(circle at 30% 25%,#5b8cff,#23356b);box-shadow:0 12px 30px rgba(70,120,255,.35);}
  .wel h2{margin:2px 0 0;font-size:16px;font-weight:600;color:#e8efff;}
  .wel p{margin:0;font-size:12px;line-height:1.7;color:#93a4c4;max-width:380px;}
  .wel .row2{display:flex;gap:8px;margin-top:6px;}
  .wel .tip{font-size:11px;color:#62748f;}

  /* 模型脚下一层很淡的落地光：没有它，透明背景上的模型像浮在空中 */
  #preview::after{
    content:""; position:absolute; left:50%; bottom:5%; width:230px; height:30px;
    margin-left:-115px; border-radius:50%; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at center, rgba(91,140,255,.13), transparent 70%);
  }
  #preview canvas{display:block;}
  /* 取景工具条：读数是主窗口真正会看到的那一段；两个按钮各自解决「看不准」和「不敢拖」 */
  .vf-bar{position:absolute; left:12px; top:10px; z-index:4; display:flex; align-items:center; gap:6px;
    padding:5px 6px 5px 10px; border-radius:9px; background:rgba(12,18,32,.72);
    border:1px solid rgba(44,61,97,.8); backdrop-filter:blur(6px);}
  .vf-read{font-size:11px; color:#9fb2d4; letter-spacing:.02em; font-variant-numeric:tabular-nums;}
  .vf-btn{height:22px; padding:0 8px; border-radius:6px; border:1px solid #33406a;
    background:rgba(35,43,64,.9); color:#c9d6ee; font-size:11px; cursor:pointer;}
  .vf-btn:hover{background:#2c3652; color:#fff;}
  .vf-btn.on{background:rgba(91,140,255,.26); border-color:rgba(91,140,255,.6); color:#e6efff;}
  /* 主窗口视图：左右压暗成竖条，只留中间 460:560 的口子，和桌宠窗口一模一样 */
  .vf-mask{position:absolute; top:0; bottom:0; width:0; background:#0c1018; opacity:0;
    pointer-events:none; transition:opacity .16s, width .16s; z-index:3;}
  #preview.crop .vf-mask{opacity:.97;}
  #preview.crop .vf-bar{background:rgba(12,18,32,.5);}
  .stage-hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    color:var(--dim2); font-size:12.5px; text-align:center; line-height:1.8;
  }
  .stage-bar{
    flex:0 0 auto; display:flex; align-items:center; gap:5px;
    padding:7px 10px; border-top:1px solid var(--line);
    background:rgba(18,20,28,.86); backdrop-filter:blur(8px);
    flex-wrap:wrap;
  }
  .stage-bar .lbl{font-size:11px; color:var(--dim2); margin-right:2px;}
  .stage-bar .sep{width:1px;height:16px;background:var(--line); margin:0 4px;}
  /* 19 个 chip 挤在一条上：把高度和字号各收一档，三行变两行 */
  .chip{
    height:23px; padding:0 8px; border-radius:999px; font-size:11px;
    background:#212736; border:1px solid #2b3247; color:#b9c0d4;
  }
  /* 按下的那一下要看得见：不然 19 个 chip 点完不知道刚点了谁 */
  .chip.on{background:#2b3a5c; border-color:#4a6ea8; color:#e7eeff;}
  .chip:hover{background:#2a3247; color:#e8eaf2;}
  .chip.on{background:#2c3a5c; border-color:#3f5588; color:#cfe0ff;}
  .badge{
    position:absolute; right:10px; top:10px; display:flex; gap:6px;
    font-size:11px; color:var(--dim2);
  }
  .badge .b{
    background:rgba(16,18,26,.82); border:1px solid var(--line);
    padding:3px 8px; border-radius:7px;
  }
  .badge .b b{color:#c7cee0; font-weight:600;}

  /* 右：表单 */
  .form{
    width:392px; flex:0 0 auto; display:flex; flex-direction:column;
    background:var(--panel); border-left:1px solid var(--line); min-height:0;
  }
  .form-h{
    padding:11px 14px 9px; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid var(--line);
  }
  .form-h .t{font-size:12.5px; font-weight:600;}
  .form-h .st{
    margin-left:auto; font-size:11px; padding:2px 8px; border-radius:999px;
    background:#222839; color:var(--dim);
  }
  /* 七个步骤 + 素材库在同一条滚动列里：折叠的按自然高度排，展开的按内容长高，
     整列一起滚。早先让展开项吃掉剩余空间、内部再滚，结果字段被切在半行上，
     看起来像坏了。 */
  #steps{flex:1; min-height:0; display:flex; flex-direction:column; gap:8px;
    overflow-y:auto; overflow-x:hidden; padding:10px 12px 12px;}

  .step{
    flex:0 0 auto; min-height:0; display:flex; flex-direction:column;
    border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
    border-left:3px solid transparent; transition:border-color .16s;
  }
  /* 左侧色条：扫一眼就知道哪一步已经配置完整、哪一步还有问题 */
  /* min-height 是给「展开的那一步」留的底线：素材库展开后总高度超了，
     不能让当前步骤被压成 2px —— 那时候用户会以为点坏了。 */
  .step.open{flex:0 0 auto; border-color:#3a4a72;}
  .step.ok{border-left-color:#2e7d5a;}
  .step.bad{border-left-color:#8c3a44;}
  .step:not(.open) > .hd{padding-top:6px; padding-bottom:6px;}
  .step > .hd{
    display:flex; align-items:center; gap:8px; padding:9px 11px;
    background:var(--panel2); cursor:pointer;
  }
  .step > .hd .idx{
    width:18px;height:18px;border-radius:6px;flex:0 0 auto;
    background:#2c3550; color:#9fb6e8; font-size:10.5px; font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .step.ok > .hd .idx{background:#1f4030; color:#6fe0a0;}
  .step.bad > .hd .idx{background:#44242a; color:#ff9a9a;}
  .step > .hd .tt{font-size:12.5px; font-weight:600;}
  .step > .hd .hint{font-size:10.5px; color:var(--dim2); margin-left:auto;}
  .step > .hd .caret{color:var(--dim2); font-size:10px; transition:transform .16s;}
  .step.open > .hd .caret{transform:rotate(90deg);}
  .step > .bd{display:none; padding:4px 11px 12px; border-top:1px solid var(--line);}
  .step.wide.open > .bd{display:grid; grid-template-columns:1fr 1fr; gap:0 14px; align-content:start;}
  .step.wide.open > .bd > .note, .step.wide.open > .bd > .fgrp{grid-column:1 / -1;}
  .fgrp{grid-column:1 / -1; margin:10px 0 2px; font-size:10.5px; letter-spacing:.04em; color:var(--faint, #62748f); border-bottom:1px solid rgba(44,61,97,.5); padding-bottom:4px;}
  .fgrp:first-child{margin-top:2px;}
  .step.open > .bd{display:block; flex:0 0 auto; overflow:visible;}

  /* 素材库：动作/表情逐条试播与绑定。固定在右栏底部（不跟着步骤滚走），
     收起时只占一行标题，展开时最多占右栏一半高度、内部自己滚。 */
  #libdock{flex:0 0 auto; padding:0 12px 10px; display:flex; flex-direction:column; min-height:0;}
  #libdock:empty{display:none;}
  .libstep{flex:0 0 auto; border:1px solid var(--line); border-radius:var(--r);
    border-left:3px solid #3a4a72; overflow:hidden; display:flex; flex-direction:column; min-height:0;}
  .libstep.open{flex:1 1 auto; max-height:46vh;}
  .libstep > .libhd{display:flex; align-items:center; gap:8px; padding:9px 11px;
    background:var(--panel2); cursor:pointer; flex:0 0 auto;}
  .libstep > .libhd .tt{font-size:12.5px; font-weight:600;}
  .libstep > .libhd .hint{font-size:10.5px; color:var(--dim2); margin-left:auto;}
  .libstep > .libhd .caret{color:var(--dim2); font-size:10px; transition:transform .16s;}
  .libstep.open > .libhd .caret{transform:rotate(90deg);}
  .libstep > .libbd{display:none; padding:8px 11px 11px; border-top:1px solid var(--line);
    overflow-y:auto;}
  .libstep.open > .libbd{display:block; flex:1 1 auto; min-height:0;}
  .bindbar{display:flex; gap:6px; align-items:center; margin:2px 0 10px; flex-wrap:wrap;}
  .bindbar select{flex:1 1 120px; min-width:0; background:#14171f; border:1px solid #2c3247;
    border-radius:7px; color:var(--text); font:12px/1.4 inherit; padding:6px 8px; outline:none;}
  .bindbar .lbtn{flex:0 0 auto; padding:6px 10px; border-radius:7px; border:1px solid #34406a;
    background:#232b40; font-size:11.5px;}
  .bindbar .lbtn:hover{background:#2c3652;}
  .lrow{display:flex; align-items:center; gap:8px; padding:5px 2px;
    border-bottom:1px dashed rgba(44,61,72,.6); font-size:11.5px;}
  .lrow:last-child{border-bottom:none;}
  .lrow .nm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lrow .tag{flex:0 0 auto; font-size:10px; padding:1px 6px; border-radius:999px;
    background:#232839; color:var(--dim);}
  .lrow .tag.und{background:#3d3320; color:#ffc857;}
  .lrow .lbtn{flex:0 0 auto; padding:3px 9px; border-radius:6px; border:1px solid #34406a;
    background:#222941; font-size:11px;}
  .lrow .lbtn:hover{background:#2c3652;}
  .libsub{font-size:10.5px; letter-spacing:.6px; color:var(--dim2); margin:10px 0 2px;}
  .fld{margin-top:10px;}
  .fld > label{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:#a9b1c8; margin-bottom:5px;
  }
  .fld > label .req{color:var(--bad); font-size:10px;}
  .fld > label .v{
    margin-left:auto; font-family:Consolas,monospace; font-size:11px; color:#8fa6d8;
  }
  .fld .note{font-size:10.5px; color:var(--dim2); margin-top:4px; line-height:1.5;}
  .fld input[type=text], .fld input[type=number], .fld select, .fld textarea{
    width:100%; background:#14171f; border:1px solid #2c3247; border-radius:7px;
    color:var(--text); font:12.5px/1.4 "Microsoft YaHei UI","Segoe UI",sans-serif;
    padding:8px 10px; outline:none; min-height:34px;
  }
  .fld input:focus, .fld select:focus, .fld textarea:focus{border-color:#4a6bb0; box-shadow:0 0 0 3px rgba(91,140,255,.13);}
  .fld textarea{min-height:62px; resize:vertical; font-family:Consolas,monospace; font-size:11.5px;}
  .fld select{cursor:pointer; appearance:none; background-image:linear-gradient(45deg,transparent 50%,#7c85a0 50%),linear-gradient(135deg,#7c85a0 50%,transparent 50%); background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:28px;}
  .fld select option{background:#14171f;}
  .fld .row{display:flex; gap:8px;}
  .fld .row > *{flex:1;}

  .sw{position:relative; width:38px; height:21px; flex:0 0 auto;}
  .sw input{opacity:0; width:0; height:0; position:absolute;}
  .sw i{
    position:absolute; inset:0; border-radius:999px; background:#2b3247;
    transition:background .16s; cursor:pointer;
  }
  .sw i::after{
    content:""; position:absolute; left:2px; top:2px; width:17px;height:17px;
    border-radius:50%; background:#8b93ad; transition:transform .16s, background .16s;
  }
  .sw input:checked + i{background:#3b62b8;}
  .sw input:checked + i::after{transform:translateX(17px); background:#fff;}

  input[type=range]{
    -webkit-appearance:none; width:100%; height:4px; border-radius:2px;
    background:#2c3247; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px;height:14px;border-radius:50%;
    background:#6d9aff; border:2px solid #1a1e2a; cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.5);
  }

  .alias{
    margin-top:8px; padding:8px 9px; border-radius:8px; background:#151922;
    border:1px solid #262c3d; font-size:11px; color:var(--dim);
    font-family:Consolas,monospace; line-height:1.7;
    max-height:110px; overflow-y:auto; white-space:pre-wrap; word-break:break-all;
  }
  .alias:empty{display:none;}

  /* 体检 */
  .diag{
    flex:0 0 auto; border-top:1px solid var(--line); background:#151822;
    padding:9px 12px; max-height:168px; overflow-y:auto;
  }
  .diag .sum{display:flex; align-items:center; gap:9px; margin-bottom:6px;}
  .diag .score{
    width:34px;height:34px;border-radius:10px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:13px; font-weight:700;
  }
  .diag .score.g{background:#1d3a2c; color:#5fe0a0;}
  .diag .score.y{background:#3d3320; color:#ffc063;}
  .diag .score.r{background:#3f2329; color:#ff8f8f;}
  .diag .txt{min-width:0; flex:1;}
  .diag .verdict{font-size:12px; font-weight:600;}
  .diag .head{font-size:11px; color:var(--dim2); margin-top:2px;}
  .issue{
    display:flex; gap:6px; font-size:11.5px; line-height:1.55;
    padding:3px 0; border-top:1px solid #1f2433;
  }
  .issue .lv{flex:0 0 auto; width:14px; text-align:center;}
  .issue.error .lv{color:var(--bad);} .issue.warn .lv{color:var(--warn);} .issue.info .lv{color:#6f8fd0;}
  .issue .ms{flex:1; min-width:0; color:#b6bdd0;}
  .issue .fx{
    flex:0 0 auto; font-size:10.5px; color:#7f9ad0; text-decoration:underline;
    text-underline-offset:2px;
  }

  footer{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:9px 12px; border-top:1px solid var(--line); background:#151822;
  }
  footer .note{font-size:11px; color:var(--dim2); flex:1; min-width:0;}
  /* 有未保存改动时页脚变色：只在右上角写「未保存」，手在下面的人看不见 */
  footer .note.warn{color:#e8c07a;}
  footer .note b{color:#a9b1c8; font-weight:600;}

  .toast{
    position:fixed; left:50%; bottom:64px; transform:translateX(-50%) translateY(8px);
    background:#232a3d; border:1px solid #38415c; color:#e8eaf2;
    padding:9px 16px; border-radius:10px; font-size:12.5px;
    box-shadow:0 10px 30px rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; z-index:99;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.bad{border-color:#5c2b2b; background:#331f22;}
  .toast.ok{border-color:#2c5c3d; background:#1e3328;}

  .empty{
    padding:26px 14px; text-align:center; color:var(--dim2);
    font-size:12px; line-height:1.9;
  }
</style>
</head>
<body>
  <header>
    <div class="mark"></div>
    <h1>模型适配器</h1>
    <span class="sub" id="hdrSub"></span>
    <div class="spacer"></div>
    <button class="win" id="btnReload" title="重读规则与清单">⟳</button>
    <button class="win close" id="btnClose" title="关闭">✕</button>
  </header>

  <div class="wrap">
    <aside class="lib">
      <div class="lib-h">模型库 <span class="n" id="packCount">0</span></div>
      <div id="packList"><div class="empty">还没有模型<br>点下面导入一个</div></div>
      <div class="lib-f">
        <button class="btn grow" id="btnImport">＋ 导入文件夹</button>
        <button class="btn grow" id="btnImportZip" title="支持 .zip，自动解包并剥掉外层文件夹">⇩ 导入压缩包</button>
      </div>
    </aside>

    <main class="stage">
      <div id="preview">
        <div class="stage-hint" id="hint">选一个模型开始适配</div>
        <div class="vf-bar" id="vfBar">
          <span class="vf-read" id="vfRead">看 50% · 顶 10%</span>
          <button class="vf-btn" id="vfCrop" title="按主窗口的比例只看取景框里的部分">主窗口视图</button>
          <button class="vf-btn" id="vfReset" title="按这个模型的长宽比重猜一个起点">推荐取景</button>
        </div>
        <div class="vf-mask l" id="vfMaskL"></div>
        <div class="vf-mask r" id="vfMaskR"></div>
        <div class="badge" id="badge"></div>
      </div>
      <div class="stage-bar" id="stageBar"></div>
    </main>

    <aside class="form">
      <div class="form-h">
        <span class="t">适配</span>
        <span class="st" id="formState">未选择</span>
      </div>
      <div id="steps"><div class="empty">左边选一个模型<br>这里会出现分步绑定</div></div>
      <div id="libdock"></div>
      <div class="diag" id="diag" style="display:none"></div>
    </aside>
  </div>

  <footer>
    <span class="note" id="footNote">导入的模型会复制到用户目录，不动原文件。</span>
    <button class="btn ghost" id="btnReset" title="把这个包的所有绑定、动作、表情、取景恢复成自动探测的初始状态">恢复默认</button>
    <button class="btn" id="btnApply">设为当前模型</button>
    <button class="btn primary" id="btnSave">保存并应用</button>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="errlog.js"></script>
<script src="../vendor/live2dcubismcore.min.js"></script>
  <script src="../vendor/live2d-vendor.js"></script>
  <!-- 内置动作库和主窗口共用同一份数据。适配器要「试一下这个动作在这台模型上长什么样」，
       没有它就只能干看参数名，等于让用户闭着眼调。38KB，本地同源，不值得走接口。 -->
  <script src="motions.js"></script>
  <script src="motions-extra.js"></script>
  <!-- 表演曲线库：适配器里要能「在这只模型上试演这个表情」。
       曲线键是槽位 id（angleX / eyeSmile），播放前按当前绑定翻译成真实参数名，
       所以换模型之后同一个按钮照样能播 —— 缺的槽位自动跳过。 -->
  <script src="expr-curves.js"></script>
  <script src="motion3.js"></script>
  <script src="adapter.js"></script>
</body>
</html>
